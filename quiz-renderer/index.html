<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Интерактивный тест по основам JavaScript" />
    <title>Quiz Renderer — JavaScript</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Quiz Renderer</p>
        <h1 id="quiz-title">Загрузка теста…</h1>
        <p id="quiz-description" class="subtitle"></p>
      </header>

      <section id="quiz-panel" class="card" aria-live="polite">
        <div class="progress-row">
          <span id="progress-text"></span>
          <span id="answered-text"></span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <form id="question-form" novalidate>
          <div id="question-container"></div>
          <p id="validation-message" class="validation" role="alert"></p>
        </form>

        <nav class="navigation" aria-label="Навигация по тесту">
          <button id="back-button" class="button button-ghost" type="button">Назад</button>
          <button id="next-button" class="button" type="button">Вперёд</button>
          <button id="finish-button" class="button button-finish" type="button">Завершить</button>
        </nav>
      </section>

      <section id="result-panel" class="card result-panel" aria-live="polite" hidden></section>
      <section id="history-panel" class="history" aria-labelledby="history-title"></section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
